reviewers:
  - id: codex-gpt5.6-sol
    harness: codex
    model: gpt-5.6-sol
    alias: gpt
    effort: high
    native: false
  - id: codex-gpt5.6-terra
    harness: codex
    model: gpt-5.6-terra
    alias: terra
    effort: high
    native: false
  - id: codex-gpt5.6-luna
    harness: codex
    model: gpt-5.6-luna
    alias: luna
    effort: high
    native: false
  - id: gemini-3.5-flash
    harness: pi
    provider: vertex
    model: gemini-3.5-flash
    alias: gemini
    effort: "-"
    native: false
  - id: glm-5.2
    harness: pi
    provider: openrouter
    model: openrouter/z-ai/glm-5.2
    alias: glm
    effort: high
    native: false
  - id: claude-opus
    harness: claude
    model: opus
    alias: opus
    effort: "-"
    native: true
  - id: claude-sonnet
    harness: claude
    model: sonnet
    alias: sonnet
    effort: "-"
    native: true

providers:
  vertex:
    env:
      GOOGLE_CLOUD_PROJECT: code17-main
      GOOGLE_CLOUD_LOCATION: global
  openrouter:
    thinking: true

defaults:
  pi: gemini-3.5-flash
