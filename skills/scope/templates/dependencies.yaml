phases:
  - id: setup
    name: Setup
    tasks:
      - id: T001
        files: [path/to/file.py]
        depends_on: []
      - id: T002
        files: [path/to/other.py]
        depends_on: [T001]

  - id: core
    name: Core Implementation
    tasks:
      - id: T003
        files: [src/feature.py]
        depends_on: [T002]
      - id: T004
        files: [src/handler.py]
        depends_on: [T002]

  - id: integration
    name: Integration
    tasks:
      - id: T005
        files: [src/main.py]
        depends_on: [T003, T004]

  - id: testing
    name: Testing
    tasks:
      - id: T006
        files: [tests/test_feature.py]
        depends_on: [T005]

batches:
  - batch: 1
    tasks: [T001]
  - batch: 2
    tasks: [T002]
  - batch: 3
    tasks: [T003, T004]
  - batch: 4
    tasks: [T005]
  - batch: 5
    tasks: [T006]

actions: []
