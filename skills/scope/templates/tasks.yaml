# Core fields (required - used by dignity/spec/tasks.py)
scope: ${SCOPE_NAME}
code: ${CODE}
next_id: 1
tasks: []

# Metadata (optional - for tracking)
meta:
  created: ${DATE}
  last_updated: ${DATE}
  progress: 0/0

# Batch signal: a pending task's `depends_on` + `files` drive parallel dispatch.
# Batches are derived from these two fields (see dependencies.yaml batching rules):
# no-dep tasks run first; a task runs in the earliest batch where all `depends_on`
# are satisfied; tasks sharing any `files` entry never co-batch. A task with no
# `files` declared defaults to its own single-task batch.

# Phases organize tasks logically (optional - for complex scopes)
# Each phase references task IDs and may have a checkpoint gate
phases: []
# Example populated structure:
#
# scope: add-auth-feature
# code: AUT
# next_id: 4
# tasks:
#   - id: AUT-001
#     content: Create auth middleware
#     status: done
#     active_form: Creating auth middleware
#     files: [src/auth/middleware.py]
#     evidence:
#       commits: [abc123, def456]
#       files: [src/auth/middleware.py]
#   - id: AUT-002
#     content: Add session storage
#     status: in_progress
#     active_form: Adding session storage
#     files: [src/auth/session.py]
#   - id: AUT-003
#     content: Write integration tests
#     status: pending
#     active_form: Writing integration tests
#     files: [tests/test_auth_integration.py]
#     depends_on: [AUT-001, AUT-002]
#
# meta:
#   created: 2025-12-17
#   last_updated: 2025-12-17
#   progress: 1/3
#
# phases:
#   - name: "Phase 1: Core"
#     task_ids: [AUT-001, AUT-002]
#     checkpoint:
#       description: Core auth working end-to-end
#       criteria:
#         - Middleware intercepts requests
#         - Sessions persist across requests
#       verified: false
#   - name: "Phase 2: Testing"
#     task_ids: [AUT-003]
