# Validation: ${SCOPE_NAME}
# Machine + human readable validation tracking

metadata:
  issue_type: ${ISSUE_TYPE}  # Initiative | Feature | Task
  created: ${DATE}
  questions_used: ${N}
  questions_limit: ${LIMIT}  # Initiative/Feature: 5, Task: 3
  approach: "${SELECTED_APPROACH}"
  source: ${SOURCE}  # scope | standalone

# Ambiguity scan runs during scope creation to identify gaps.
# Status values: clear | partial | missing
# No gaps = silent proceed (no confirmation required)
ambiguity_scan:
  scope:
    status: ${STATUS}
    gaps: []
  behavior:
    status: ${STATUS}
    gaps: []
  data_model:
    status: ${STATUS}
    gaps: []
  constraints:
    status: ${STATUS}
    gaps: []
  edge_cases:
    status: ${STATUS}
    gaps: []
  integration:
    status: ${STATUS}
    gaps: []
  terminology:
    status: ${STATUS}
    gaps: []

# Taxonomy coverage tracks which requirement areas have been addressed.
taxonomy_coverage:
  scope:
    status: ${STATUS}  # covered | gap | n/a
    source: ${SOURCE}
  behavior:
    status: ${STATUS}
    source: ${SOURCE}
  data_model:
    status: ${STATUS}
    source: ${SOURCE}
  constraints:
    status: ${STATUS}
    source: ${SOURCE}
  edge_cases:
    status: ${STATUS}
    source: ${SOURCE}
  integration:
    status: ${STATUS}
    source: ${SOURCE}
  terminology:
    status: ${STATUS}
    source: ${SOURCE}

# Clarification log records each question asked during validation.
clarification_log:
  - id: C001
    area: ${TAXONOMY_AREA}
    question: "${QUESTION}"
    answer: "${ANSWER}"
    impact_uncertainty: ${SCORE}
    integration: ${TARGET_DOC_OR_SECTION}

# Clarification sessions provide full resolution tracking with audit trail.
clarification_sessions:
  - id: S001
    timestamp: ${TIMESTAMP}
    questions:
      - id: Q001
        question: "${QUESTION}"
        answer: "${ANSWER}"
        area: ${TAXONOMY_AREA}
        doc_updates:
          - file: ${DOC_FILE}
            section: ${SECTION}
            action: ${ACTION}

# Markers track unresolved items requiring future clarification.
markers:
  - id: M001
    area: ${TAXONOMY_AREA}
    description: "${WHAT_NEEDS_CLARIFICATION}"
    doc_ref: "${DOC}#${SECTION}"
    status: open
    resolution: null

# Complexity tracking documents justified gate violations.
complexity_tracking:
  - violation: "${WHAT_EXCEEDS_SIMPLICITY}"
    justification: "${WHY_NEEDED}"
    alternative_rejected: "${SIMPLER_APPROACH_AND_WHY_NOT}"

# SDD gates enforce spec-driven development principles.
# Initiative: All gates evaluated
# Feature/Task: n/a
gates:
  simplicity:
    status: ${STATUS}  # passed | failed | n/a
    reason: "${EXPLANATION}"
  anti_abstraction:
    status: ${STATUS}
    reason: "${EXPLANATION}"
  integration_first:
    status: ${STATUS}
    reason: "${EXPLANATION}"

# Deferred items identified but not clarified due to question limit.
deferred:
  - area: ${TAXONOMY_AREA}
    question: "${QUESTION_NOT_ASKED}"

# Design document context (opt-in).
design_context:
  design_opted_in: ${BOOL}
  alternatives_described: ${BOOL}
  alternative_descriptions: []

# Readiness checklist for programmatic gate checks.
readiness:
  high_priority_areas_covered: ${BOOL}
  success_criteria_measurable: ${BOOL}
  scope_boundaries_clear: ${BOOL}
  integration_points_identified: ${BOOL}
  edge_cases_addressed: ${BOOL}

# Loqui validation results (if input contained code blocks).
loqui_check:
  present: ${BOOL}
  language: ${LANG}
  status: ${STATUS}
  violations: []
  adherence_notes: |
    ${NOTES_ON_CODE_QUALITY}

# Review configuration for implementation batch reviews.
# Used by implement to determine which reviewers to use.
review_config:
  reasoning_effort: ${REASONING_EFFORT}
  reviewers:
    - type: claude
      model: ${CLAUDE_MODEL}
    - type: pi
      model: ${OPENCODE_MODEL_1}
    - type: pi
      model: ${OPENCODE_MODEL_2}

notes: |
  ${NOTES}
