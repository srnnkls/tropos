metadata:
  issue_type: ${ISSUE_TYPE}  # Initiative | Feature | Task
  created: ${DATE}
  questions_used: ${N}
  questions_limit: ${LIMIT}  # question limit per issue type (reference/issue-types.md)
  approach: "${SELECTED_APPROACH}"
  source: ${SOURCE}  # scope | standalone

ambiguity_scan:
  # Status values: clear | partial | missing
  scope:
    status: ${STATUS}
    gaps: []
  behavior:
    status: ${STATUS}
    gaps: []
  data_model:
    status: ${STATUS}
    gaps: []
  constraints:
    status: ${STATUS}
    gaps: []
  edge_cases:
    status: ${STATUS}
    gaps: []
  integration:
    status: ${STATUS}
    gaps: []
  terminology:
    status: ${STATUS}
    gaps: []
  conventions:
    status: ${STATUS}
    gaps: []

clarification_sessions:
  - id: S001
    timestamp: ${TIMESTAMP}
    questions:
      - id: Q001
        question: "${QUESTION}"
        answer: "${ANSWER}"
        area: ${TAXONOMY_AREA}
        doc_updates:
          - file: ${DOC_FILE}
            section: ${SECTION}
            action: ${ACTION}

markers:
  - id: M001
    area: ${TAXONOMY_AREA}
    description: "${WHAT_NEEDS_CLARIFICATION}"
    doc_ref: "${DOC}#${SECTION}"
    status: open
    resolution: null

complexity_tracking:
  - violation: "${WHAT_EXCEEDS_SIMPLICITY}"
    justification: "${WHY_NEEDED}"
    alternative_rejected: "${SIMPLER_APPROACH_AND_WHY_NOT}"

gates:
  # Initiative: All gates evaluated | Feature/Task: n/a
  simplicity:
    status: ${STATUS}  # passed | failed | n/a
    reason: "${EXPLANATION}"
  anti_abstraction:
    status: ${STATUS}
    reason: "${EXPLANATION}"
  integration_first:
    status: ${STATUS}
    reason: "${EXPLANATION}"

assumptions:
  - id: A001
    area: ${TAXONOMY_AREA}
    question: "${QUESTION_NOT_ASKED}"
    assumed: "${DEFAULT_TAKEN}"
    load_bearing: ${BOOL}  # a different answer changes tasks, interfaces, or data model
    status: assumed  # assumed | confirmed | revised
    source: ${SOURCE}  # scope | scope-review | clarify

review_config:
  reasoning_effort: ${REASONING_EFFORT}
  reviewers: ${REVIEWERS}

review_gate:
  # Mandatory blocking gate — must be `passed` before implement/loop will execute the scope.
  status: ${STATUS}  # passed | failed (absent ⇒ not yet reviewed ⇒ not implementable)
  reviewers: ${REVIEWERS}  # configured host-native and/or external agents that cleared the gate
  reviewed_at: ${TIMESTAMP}
  blocking_resolved: ${N}   # critical/high findings folded back before pass
  deferred_nits: []         # medium findings carried forward

notes: |
  ${NOTES}
