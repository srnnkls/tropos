metadata:
  issue_type: ${ISSUE_TYPE}  # Initiative | Feature | Task
  created: ${DATE}
  questions_used: ${N}
  questions_limit: ${LIMIT}  # Initiative/Feature: 5 | Task: 3
  approach: "${SELECTED_APPROACH}"
  source: ${SOURCE}  # scope | standalone

ambiguity_scan:
  # Status values: clear | partial | missing
  scope:
    status: ${STATUS}
    gaps: []
  behavior:
    status: ${STATUS}
    gaps: []
  data_model:
    status: ${STATUS}
    gaps: []
  constraints:
    status: ${STATUS}
    gaps: []
  edge_cases:
    status: ${STATUS}
    gaps: []
  integration:
    status: ${STATUS}
    gaps: []
  terminology:
    status: ${STATUS}
    gaps: []

taxonomy_coverage:
  scope:
    status: ${STATUS}  # covered | gap | n/a
    source: ${SOURCE}
  behavior:
    status: ${STATUS}
    source: ${SOURCE}
  data_model:
    status: ${STATUS}
    source: ${SOURCE}
  constraints:
    status: ${STATUS}
    source: ${SOURCE}
  edge_cases:
    status: ${STATUS}
    source: ${SOURCE}
  integration:
    status: ${STATUS}
    source: ${SOURCE}
  terminology:
    status: ${STATUS}
    source: ${SOURCE}

clarification_log:
  - id: C001
    area: ${TAXONOMY_AREA}
    question: "${QUESTION}"
    answer: "${ANSWER}"
    impact_uncertainty: ${SCORE}
    integration: ${TARGET_DOC_OR_SECTION}

clarification_sessions:
  - id: S001
    timestamp: ${TIMESTAMP}
    questions:
      - id: Q001
        question: "${QUESTION}"
        answer: "${ANSWER}"
        area: ${TAXONOMY_AREA}
        doc_updates:
          - file: ${DOC_FILE}
            section: ${SECTION}
            action: ${ACTION}

markers:
  - id: M001
    area: ${TAXONOMY_AREA}
    description: "${WHAT_NEEDS_CLARIFICATION}"
    doc_ref: "${DOC}#${SECTION}"
    status: open
    resolution: null

complexity_tracking:
  - violation: "${WHAT_EXCEEDS_SIMPLICITY}"
    justification: "${WHY_NEEDED}"
    alternative_rejected: "${SIMPLER_APPROACH_AND_WHY_NOT}"

gates:
  # Initiative: All gates evaluated | Feature/Task: n/a
  simplicity:
    status: ${STATUS}  # passed | failed | n/a
    reason: "${EXPLANATION}"
  anti_abstraction:
    status: ${STATUS}
    reason: "${EXPLANATION}"
  integration_first:
    status: ${STATUS}
    reason: "${EXPLANATION}"

deferred:
  - area: ${TAXONOMY_AREA}
    question: "${QUESTION_NOT_ASKED}"

design_context:
  design_opted_in: ${BOOL}
  alternatives_described: ${BOOL}
  alternative_descriptions: []

readiness:
  high_priority_areas_covered: ${BOOL}
  success_criteria_measurable: ${BOOL}
  scope_boundaries_clear: ${BOOL}
  integration_points_identified: ${BOOL}
  edge_cases_addressed: ${BOOL}

loqui_check:
  present: ${BOOL}
  language: ${LANG}
  status: ${STATUS}
  violations: []
  adherence_notes: |
    ${NOTES_ON_CODE_QUALITY}

review_config:
  reasoning_effort: ${REASONING_EFFORT}
  # reviewers resolved from --reviewers / interactive selection against `peer list`
  reviewers: ${REVIEWERS}

notes: |
  ${NOTES}
