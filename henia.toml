artifacts = ["skills"]

[build]
output = ".henia/build"
clean = true

[harness.claude]
artifacts = ["skills", "agents"]
profile = "claude"
directives = "xml"
strict = true

[harness.claude.skills]
dynamic = ["debate", "dispatch", "limen", "loqui", "validate"]

[harness.claude.variables]
preload_context = "true"
context_instruction = ""
resolve_slots = "henia slots --global ${CLAUDE_SKILL_DIR}/.."

[harness.codex]
artifacts = ["skills", "agents"]
profile = "codex"
directives = "keep"
strict = true

[harness.codex.variables]
preload_context = "false"
context_instruction = "Run these commands with the shell tool from the working directory before applying the workflow, resolving `scripts/` and `../` script paths against this skill's directory; use their output as context."
resolve_slots = 'henia slots --global "${CODEX_HOME:-$HOME/.codex}/skills"'

[harness.pi]
artifacts = ["skills", "agents"]
profile = "pi-omp"
directives = "keep"
strict = true

[harness.pi.variables]
preload_context = "false"
context_instruction = "Run these commands with the shell tool from the working directory before applying the workflow, resolving `scripts/` and `../` script paths against this skill's directory; use their output as context."
resolve_slots = 'henia slots --global "$HOME/.pi/agent/skills"'

[harness.pi.references]
skill = "/skill:{{.Name}}"

[harness.omp]
artifacts = ["skills", "agents"]
profile = "pi-omp"
directives = "keep"
strict = true

[harness.omp.variables]
preload_context = "false"
context_instruction = "Run these commands with the shell tool from the working directory before applying the workflow, resolving `scripts/` and `../` script paths against this skill's directory; use their output as context."
resolve_slots = 'henia slots --global "$HOME/.omp/agent/skills"'

[harness.omp.references]
skill = "/skill:{{.Name}}"

[harness.claude.agents]
profile = "claude-agent"
layout = "flat"

[harness.claude.files]
"instructions/AGENTS.md" = { source = "instructions/AGENTS.md" }
"CLAUDE.md" = { source = "instructions/AGENTS.md" }
"agents/implementer.toml" = { source = "agents/implementer.toml" }
"agents/reviewer.toml" = { source = "agents/reviewer.toml" }
"agents/tester.toml" = { source = "agents/tester.toml" }

[harness.codex.agents]
profile = "portable-agent"
layout = "flat"

[harness.codex.files]
"instructions/AGENTS.md" = { source = "instructions/AGENTS.md" }
"AGENTS.md" = { source = "instructions/AGENTS.md" }

[harness.pi.agents]
profile = "portable-agent"
layout = "flat"

[harness.pi.files]
"instructions/AGENTS.md" = { source = "instructions/AGENTS.md" }
"AGENTS.md" = { source = "instructions/AGENTS.md" }

[harness.omp.agents]
profile = "portable-agent"
layout = "flat"

[harness.omp.files]
"instructions/AGENTS.md" = { source = "instructions/AGENTS.md" }
"AGENTS.md" = { source = "instructions/AGENTS.md" }

[lint]
external = ["skill:gestalt", "command:plan"]

[[lint.registries]]
id = "unknown-slot"
declare = 'map(split(frontmatter.metadata?.slots ?? "", " "), split(#, ":")[0])'
reference = 'map(split((frontmatter.metadata?.provides ?? "") + " " + (frontmatter.metadata?.applies ?? ""), " "), split(#, "@")[0])'
match = "dotted"
severity = "error"
