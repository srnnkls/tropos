artifacts = ["skills"]

[dependencies.loqui]
repo = "srnnkls/loqui"
branch = "main"
skills = ["loqui"]

[dependencies.ponytail]
repo = "DietrichGebert/ponytail"
tag = "v5.2.0"
skills = ["ponytail"]

[slots."implement.approach"]
provide = ["ponytail:ponytail"]

[harness.claude]
artifacts = ["skills", "agents", "config"]
profile = "claude"
directives = "xml"
strict = true

[harness.claude.skills]
default = "dynamic"
hybrid = ["clarify", "code", "continue", "debate", "dispatch", "git", "herdr", "implement", "issue", "loop", "loqui", "memex", "pr", "review", "rsb", "scope", "sweep", "tfcp", "tfcprr", "validate"]

[harness.claude.agents]
profile = "claude-agent"
layout = "flat"

[harness.claude.files]
"agents/implementer.toml" = { source = "agents/implementer.toml" }
"agents/reviewer.toml" = { source = "agents/reviewer.toml" }
"agents/tester.toml" = { source = "agents/tester.toml" }
"CLAUDE.md" = { source = "instructions/AGENTS.md" }
"instructions/AGENTS.md" = { source = "instructions/AGENTS.md" }

[harness.claude.config.permissions]
deny = ["ListAgents", "SendMessage"]

[harness.claude.config.hooks]
SessionStart = [
  { hooks = [{ type = "command", command = "fas eval --harness claude" }] },
]
UserPromptSubmit = [
  { hooks = [{ type = "command", command = "fas eval --harness claude" }] },
]
PreToolUse = [
  { hooks = [{ type = "command", command = "fas eval --harness claude" }] },
  { matcher = "Task|Agent", hooks = [{ type = "command", command = "peer route hook -C \"$CLAUDE_PROJECT_DIR\"" }] },
]
PostToolUse = [
  { hooks = [{ type = "command", command = "fas eval --harness claude" }] },
]
Notification = [
  { hooks = [{ type = "command", command = "fas eval --harness claude" }] },
]
PreCompact = [
  { hooks = [{ type = "command", command = "fas eval --harness claude" }] },
]
SubagentStart = [
  { hooks = [{ type = "command", command = "fas eval --harness claude" }] },
]
SubagentStop = [
  { hooks = [{ type = "command", command = "fas eval --harness claude" }] },
]
Stop = [
  { hooks = [{ type = "command", command = "fas eval --harness claude" }] },
]
SessionEnd = [
  { hooks = [{ type = "command", command = "fas eval --harness claude" }] },
]

[harness.codex]
artifacts = ["skills", "agents"]
profile = "codex"
directives = "keep"
strict = true

[harness.codex.skills]
default = "dynamic"
hybrid = ["clarify", "code", "continue", "debate", "dispatch", "git", "herdr", "implement", "issue", "loop", "loqui", "memex", "pr", "review", "rsb", "scope", "sweep", "tfcp", "tfcprr", "validate"]

[harness.codex.agents]
profile = "portable-agent"
layout = "flat"

[harness.codex.files]
"AGENTS.md" = { source = "instructions/AGENTS.md" }
"instructions/AGENTS.md" = { source = "instructions/AGENTS.md" }

