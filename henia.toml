artifacts = ["skills"]

[build]
output = ".henia/build"
clean = true

[harness.claude]
artifacts = ["skills", "agents"]
profile = "claude"
format = "xml"
strict = true

[harness.claude.variables]
preload_context = "true"
context_instruction = ""

[harness.codex]
artifacts = ["skills", "agents"]
profile = "codex"
format = "directives"
strict = true

[harness.codex.variables]
preload_context = "false"
context_instruction = "Run these commands with the shell tool before applying the workflow; use their output as context."

[harness.pi]
artifacts = ["skills", "agents"]
profile = "pi-omp"
format = "directives"
strict = true

[harness.pi.variables]
preload_context = "false"
context_instruction = "Run these commands with the shell tool before applying the workflow; use their output as context."

[harness.pi.references.skill]
output = "/skill:{{.Name}}"

[harness.omp]
artifacts = ["skills", "agents"]
profile = "pi-omp"
format = "directives"
strict = true

[harness.omp.variables]
preload_context = "false"
context_instruction = "Run these commands with the shell tool before applying the workflow; use their output as context."

[harness.omp.references.skill]
output = "/skill:{{.Name}}"

[harness.claude.artifact_mappings.agents]
profile = "claude-agent"
structure = "flat"

[harness.claude.files]
"instructions/AGENTS.md" = { source = "instructions/AGENTS.md" }
"CLAUDE.md" = { source = "instructions/AGENTS.md", replace = { "](../" = "](" } }

[harness.codex.artifact_mappings.agents]
profile = "portable-agent"
structure = "flat"

[harness.codex.files]
"instructions/AGENTS.md" = { source = "instructions/AGENTS.md" }
"AGENTS.md" = { source = "instructions/AGENTS.md", replace = { "](../" = "](" } }

[harness.pi.artifact_mappings.agents]
profile = "portable-agent"
structure = "flat"

[harness.pi.files]
"instructions/AGENTS.md" = { source = "instructions/AGENTS.md" }
"AGENTS.md" = { source = "instructions/AGENTS.md", replace = { "](../" = "](" } }

[harness.omp.artifact_mappings.agents]
profile = "portable-agent"
structure = "flat"

[harness.omp.files]
"instructions/AGENTS.md" = { source = "instructions/AGENTS.md" }
"AGENTS.md" = { source = "instructions/AGENTS.md", replace = { "](../" = "](" } }
