artifacts = ["skills"]

[dependencies.gestalt]
git = "https://github.com/srnnkls/gestalt.git"
branch = "main"
skills = ["gestalt"]

[dependencies.limen]
git = "https://github.com/srnnkls/limen.git"
branch = "main"
skills = ["limen"]

[dependencies.loqui]
git = "https://github.com/srnnkls/loqui.git"
branch = "main"
skills = ["loqui"]

[build]
output = ".henia/build"
clean = true

[harness.claude]
artifacts = ["skills", "agents"]
profile = "claude"
directives = "xml"
strict = true

[harness.claude.skills]
default = "dynamic"
hybrid = ["clarify", "code", "continue", "debate", "dispatch", "git", "implement", "issue", "loop", "pr", "review", "scope", "tfcp", "tfcprr", "validate"]

[harness.claude.variables]
preload_context = "true"
context_instruction = ""

[harness.codex]
artifacts = ["skills", "agents"]
profile = "codex"
directives = "keep"
strict = true

[harness.codex.skills]
default = "dynamic"
hybrid = ["clarify", "code", "continue", "debate", "dispatch", "git", "implement", "issue", "loop", "pr", "review", "scope", "tfcp", "tfcprr", "validate"]

[harness.codex.variables]
preload_context = "false"
context_instruction = "Run these commands with the shell tool from the working directory before applying the workflow, resolving `scripts/` and `../` script paths against this skill's directory; use their output as context."

[harness.pi]
artifacts = ["skills", "agents"]
profile = "pi-omp"
directives = "keep"
strict = true

[harness.pi.skills]
default = "dynamic"
hybrid = ["clarify", "code", "continue", "debate", "dispatch", "git", "implement", "issue", "loop", "pr", "review", "scope", "tfcp", "tfcprr", "validate"]

[harness.pi.variables]
preload_context = "false"
context_instruction = "Run these commands with the shell tool from the working directory before applying the workflow, resolving `scripts/` and `../` script paths against this skill's directory; use their output as context."

[harness.pi.references]
skill = "/skill:{{.Name}}"

[harness.omp]
artifacts = ["skills", "agents"]
profile = "pi-omp"
directives = "keep"
strict = true

[harness.omp.skills]
default = "dynamic"
hybrid = ["clarify", "code", "continue", "debate", "dispatch", "git", "implement", "issue", "loop", "pr", "review", "scope", "tfcp", "tfcprr", "validate"]

[harness.omp.variables]
preload_context = "false"
context_instruction = "Run these commands with the shell tool from the working directory before applying the workflow, resolving `scripts/` and `../` script paths against this skill's directory; use their output as context."

[harness.omp.references]
skill = "/skill:{{.Name}}"

[harness.claude.agents]
profile = "claude-agent"
layout = "flat"

[harness.claude.files]
"instructions/AGENTS.md" = { source = "instructions/AGENTS.md" }
"CLAUDE.md" = { source = "instructions/AGENTS.md" }
"agents/implementer.toml" = { source = "agents/implementer.toml" }
"agents/reviewer.toml" = { source = "agents/reviewer.toml" }
"agents/tester.toml" = { source = "agents/tester.toml" }

[harness.codex.agents]
profile = "portable-agent"
layout = "flat"

[harness.codex.files]
"instructions/AGENTS.md" = { source = "instructions/AGENTS.md" }
"AGENTS.md" = { source = "instructions/AGENTS.md" }

[harness.pi.agents]
profile = "portable-agent"
layout = "flat"

[harness.pi.files]
"instructions/AGENTS.md" = { source = "instructions/AGENTS.md" }
"AGENTS.md" = { source = "instructions/AGENTS.md" }

[harness.omp.agents]
profile = "portable-agent"
layout = "flat"

[harness.omp.files]
"instructions/AGENTS.md" = { source = "instructions/AGENTS.md" }
"AGENTS.md" = { source = "instructions/AGENTS.md" }

