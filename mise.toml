[tasks."prototype:build"]
description = "Build the selected Henia checkout into the repository-local tool directory"
run = 'mkdir -p .henia/bin && go build -C "${HENIA_SOURCE:?Set HENIA_SOURCE to a Henia checkout}" -o "$PWD/.henia/bin/henia" ./cmd/henia'

[tasks."prototype:sync"]
description = "Compile all 25 canonical skills and dependencies, deploy with Phora, and smoke-test artifacts"
run = "python3 scripts/sync-harnesses.py --no-progress"

[tasks."prototype:test"]
description = "Exercise clean/repeat deployment and compiler failure in a disposable repository"
run = "scrut test tests/scrut/henia-phora.md"

[tasks."prototype:smoke"]
description = "Check the deployed Claude Code, Codex, Pi and OMP artifacts"
run = "scrut test tests/scrut/henia-artifacts.md"

[tasks.loqui-link]
description = "Symlink skills/loqui/reference/loqui to a local loqui checkout"
usage = '''
flag "-p --path <path>" help="Path to local loqui checkout (default: cache dir, cloned if missing)"
'''
run = """
#!/usr/bin/env bash
set -euo pipefail

GIT_ROOT="$(git rev-parse --show-toplevel)"
LINK_PATH="skills/loqui/reference/loqui"

if [[ -n "${XDG_CACHE_HOME:-}" ]]; then
  CACHE_BASE="$XDG_CACHE_HOME"
elif [[ "$(uname -s)" == "Darwin" ]]; then
  CACHE_BASE="$HOME/Library/Caches"
else
  CACHE_BASE="$HOME/.cache"
fi
DEFAULT_PATH="$CACHE_BASE/tropos/loqui"
LOQUI_LOCAL="${usage_path:-$DEFAULT_PATH}"

if [[ ! -d "$LOQUI_LOCAL" ]]; then
  if [[ -z "${usage_path:-}" ]]; then
    mkdir -p "$(dirname "$LOQUI_LOCAL")"
    git clone -q https://github.com/srnnkls/loqui.git "$LOQUI_LOCAL"
  else
    echo "error: $LOQUI_LOCAL does not exist" >&2
    exit 1
  fi
fi

cd "$GIT_ROOT"

if [[ -L "$LINK_PATH" && "$(readlink "$LINK_PATH")" == "$LOQUI_LOCAL" ]]; then
  echo "already linked: $LINK_PATH -> $LOQUI_LOCAL"
  exit 0
fi

mkdir -p "$(dirname "$LINK_PATH")"
if [[ -e "$LINK_PATH" || -L "$LINK_PATH" ]]; then
  rm -rf "$LINK_PATH"
fi
ln -s "$LOQUI_LOCAL" "$LINK_PATH"

echo "linked: $LINK_PATH -> $LOQUI_LOCAL"
"""

[tasks.loqui-unlink]
description = "Remove the loqui symlink"
run = """
#!/usr/bin/env bash
set -euo pipefail

GIT_ROOT="$(git rev-parse --show-toplevel)"
LINK_PATH="skills/loqui/reference/loqui"

cd "$GIT_ROOT"

if [[ -L "$LINK_PATH" ]]; then
  rm "$LINK_PATH"
  echo "removed: $LINK_PATH"
else
  echo "nothing to remove at $LINK_PATH"
fi
"""

[tasks.test-workflow-contracts]
description = "Validate workflow ownership and peer interfaces"
run = """
#!/usr/bin/env bash
set -euo pipefail

GIT_ROOT="$(git rev-parse --show-toplevel)"
cd "$GIT_ROOT"

skills/skill/scripts/workflow-contract-test
for test in layout preflight fanout classify route; do
  "skills/peer/scripts/peer-${test}-test"
done
"""

[tasks.install-peer]
description = "Install the peer external-agent runner onto PATH (~/.local/bin)"
run = """
#!/usr/bin/env bash
set -euo pipefail

GIT_ROOT="$(git rev-parse --show-toplevel)"
SRC="$GIT_ROOT/skills/peer/scripts/peer"
DEST="$HOME/.local/bin/peer"
AGENTS_DEST="${CLAUDE_CONFIG_DIR:-$HOME/.claude}/agents"

mkdir -p "$HOME/.local/bin" "$AGENTS_DEST"
ln -sf "$SRC" "$DEST"
for role in tester implementer reviewer; do
  source="$GIT_ROOT/agents/$role.md"
  target="$AGENTS_DEST/$role.md"
  if [[ ! -e "$target" && ! -L "$target" ]]; then
    ln -s "$source" "$target"
  elif [[ "$(realpath "$target")" != "$(realpath "$source")" ]]; then
    printf 'error: %s does not resolve to %s\n' "$target" "$source" >&2
    exit 1
  fi
done
PEER_AGENTS_DIR="$AGENTS_DEST" "$DEST" route sync
echo "installed: $DEST -> $SRC"
echo "generated: $AGENTS_DEST"
"""

[tasks.install-issue]
description = "Install the issue authoring/gh wrapper onto PATH (~/.local/bin)"
run = """
#!/usr/bin/env bash
set -euo pipefail

GIT_ROOT="$(git rev-parse --show-toplevel)"
SRC="$GIT_ROOT/skills/issue/scripts/issue"
DEST="$HOME/.local/bin/issue"

mkdir -p "$HOME/.local/bin"
ln -sf "$SRC" "$DEST"
echo "installed: $DEST -> $SRC"
"""
