[tasks.test-artifacts]
description = "Prepare this tree with Phora, compile every harness with Henia, and check the artifacts"
run = "scrut test tests/scrut/henia-artifacts.md"

[tasks.test-workflow-contracts]
description = "Validate workflow ownership and peer interfaces"
run = """
#!/usr/bin/env bash
set -euo pipefail

GIT_ROOT="$(git rev-parse --show-toplevel)"
cd "$GIT_ROOT"

skills/skill/scripts/workflow-contract-test
for test in layout preflight fanout classify route; do
  "skills/peer/scripts/peer-${test}-test"
done
"""

[tasks.install-peer]
description = "Generate peer routes from the deployed roles; Phora deploys the peer runner itself"
run = """
#!/usr/bin/env bash
set -euo pipefail

AGENTS_DEST="${CLAUDE_CONFIG_DIR:-$HOME/.claude}/agents"

command -v peer >/dev/null 2>&1 || {
  printf 'error: peer is not on PATH; deploy Tropos with Phora first\n' >&2
  exit 1
}
for role in tester implementer reviewer; do
  if [[ ! -f "$AGENTS_DEST/$role.md" ]]; then
    printf 'error: %s is not deployed; compile and deploy Tropos with Phora first\n' "$AGENTS_DEST/$role.md" >&2
    exit 1
  fi
done
PEER_AGENTS_DIR="$AGENTS_DEST" peer route sync
echo "generated: $AGENTS_DEST"
"""

[tasks.install-issue]
description = "Install the issue authoring/gh wrapper onto PATH (~/.local/bin)"
run = """
#!/usr/bin/env bash
set -euo pipefail

GIT_ROOT="$(git rev-parse --show-toplevel)"
SRC="$GIT_ROOT/skills/issue/scripts/issue"
DEST="$HOME/.local/bin/issue"

mkdir -p "$HOME/.local/bin"
ln -sf "$SRC" "$DEST"
echo "installed: $DEST -> $SRC"
"""
