[task_config]
includes = ["mise/tasks"]

[tasks.loqui-link]
description = "Symlink skills/loqui/reference/loqui to a local loqui checkout"
usage = '''
flag "-p --path <path>" help="Path to local loqui checkout (default: cache dir, cloned if missing)"
'''
run = """
#!/usr/bin/env bash
set -euo pipefail

GIT_ROOT="$(git rev-parse --show-toplevel)"
LINK_PATH="skills/loqui/reference/loqui"

if [[ -n "${XDG_CACHE_HOME:-}" ]]; then
  CACHE_BASE="$XDG_CACHE_HOME"
elif [[ "$(uname -s)" == "Darwin" ]]; then
  CACHE_BASE="$HOME/Library/Caches"
else
  CACHE_BASE="$HOME/.cache"
fi
DEFAULT_PATH="$CACHE_BASE/tropos/loqui"
LOQUI_LOCAL="${usage_path:-$DEFAULT_PATH}"

if [[ ! -d "$LOQUI_LOCAL" ]]; then
  if [[ -z "${usage_path:-}" ]]; then
    mkdir -p "$(dirname "$LOQUI_LOCAL")"
    git clone -q https://github.com/srnnkls/loqui.git "$LOQUI_LOCAL"
  else
    echo "error: $LOQUI_LOCAL does not exist" >&2
    exit 1
  fi
fi

cd "$GIT_ROOT"

if [[ -L "$LINK_PATH" && "$(readlink "$LINK_PATH")" == "$LOQUI_LOCAL" ]]; then
  echo "already linked: $LINK_PATH -> $LOQUI_LOCAL"
  exit 0
fi

mkdir -p "$(dirname "$LINK_PATH")"
if [[ -e "$LINK_PATH" || -L "$LINK_PATH" ]]; then
  rm -rf "$LINK_PATH"
fi
ln -s "$LOQUI_LOCAL" "$LINK_PATH"

echo "linked: $LINK_PATH -> $LOQUI_LOCAL"
"""

[tasks.loqui-unlink]
description = "Remove the loqui symlink"
run = """
#!/usr/bin/env bash
set -euo pipefail

GIT_ROOT="$(git rev-parse --show-toplevel)"
LINK_PATH="skills/loqui/reference/loqui"

cd "$GIT_ROOT"

if [[ -L "$LINK_PATH" ]]; then
  rm "$LINK_PATH"
  echo "removed: $LINK_PATH"
else
  echo "nothing to remove at $LINK_PATH"
fi
"""

[tasks.bootstrap]
description = "Create worktree for a branch, build image, and install tools"
usage = '''
arg "<branch>" help="Git branch to checkout in a worktree"
'''
run = """
#!/usr/bin/env bash
set -euo pipefail

BRANCH="${usage_branch}"
GIT_ROOT="$(git rev-parse --show-toplevel)"
WORKTREE="${GIT_ROOT}/.worktrees/${BRANCH}"
COMPOSE_FILE="${GIT_ROOT}/docker/compose.yml"

if [[ ! -d "$WORKTREE" ]]; then
  git worktree add "$WORKTREE" "$BRANCH"
fi

docker compose --file "$COMPOSE_FILE" build
docker compose --file "$COMPOSE_FILE" run --rm bootstrap
"""

[tasks.claude]
description = "Run claude in an isolated container (one-shot by default, --loop for autonomous mode)"
usage = '''
flag "-l --loop" help="Prefix prompt with /loop to run the autonomous loop skill"
flag "-H --headless" help="Run detached (no output stream)"
flag "-b --branch <branch>" help="Use worktree for this branch (requires prior bootstrap)"
arg "<prompt>" help="Prompt to pass to claude" var
'''
run = """
#!/usr/bin/env bash
set -euo pipefail

GIT_ROOT="$(git rev-parse --show-toplevel)"

if [[ -n "${usage_branch:-}" ]]; then
  WORKSPACE="${GIT_ROOT}/.worktrees/${usage_branch}"
  if [[ ! -d "$WORKSPACE" ]]; then
    git worktree add "$WORKSPACE" "${usage_branch}"
  fi
else
  WORKSPACE="$(pwd)"
fi

if [[ "${usage_loop:-false}" == "true" ]]; then
  PROMPT="/loop ${usage_prompt}"
else
  PROMPT="${usage_prompt}"
fi

COMPOSE=(docker compose --file "${GIT_ROOT}/docker/compose.yml" run --rm)

if [[ "${usage_headless:-false}" == "true" ]]; then
  COMPOSE+=(--detach)
  WORKSPACE="$WORKSPACE" "${COMPOSE[@]}" claude --print "${PROMPT}"
else
  WORKSPACE="$WORKSPACE" "${COMPOSE[@]}" claude "${PROMPT}"
fi
"""
