
[[lint.rules]]
id = "custom-document"
select = "document"
assert = '"license" in frontmatter'
message = "Rejected document."
severity = "error"

[[lint.rules]]
id = "custom-frontmatter"
select = "frontmatter"
assert = 'len(node.value) >= 10'
message = "Rejected frontmatter."
when = 'node.name == "description"'

[[lint.rules]]
id = "custom-directive"
select = "directive"
assert = 'node.attrs.priority == "high"'
message = "Rejected directive."
when = 'node.name == "instruction"'

[[lint.rules]]
id = "custom-heading"
select = "heading"
assert = 'node.level <= 2'
message = "Rejected heading."

[[lint.rules]]
id = "custom-paragraph"
select = "paragraph"
assert = 'not (node.text contains "reject")'
message = "Rejected paragraph."

[[lint.rules]]
id = "custom-link"
select = "link"
assert = 'node.destination startsWith "https://"'
message = "Rejected link."
when = 'node.destination startsWith "http"'

[[lint.rules]]
id = "custom-image"
select = "image"
assert = 'node.destination startsWith "https://"'
message = "Rejected image."
