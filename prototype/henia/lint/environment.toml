[[lint.rules]]
id = "environment"
select = "document"
assert = 'node.kind == "document" and not node.dynamic and node.start <= 0 and node.end == len(document.body) and node.text == document.body and document.path endsWith "SKILL.md" and document.kind == "skill" and document.lines > 0 and (frontmatter.missing ?? "fallback") == "fallback" and frontmatter.policy.level == "high"'
message = "Environment differs."

[[lint.rules]]
id = "inline"
select = "directive"
when = 'node.inline'
assert = 'node.name == "note" and node.text == "Valid" and node.start >= 0 and node.end > node.start'
message = "Inline differs."
