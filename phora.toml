# Canonical artifacts and their dependency layout, offered to consumers.
[sources.moira]
git = "https://github.com/srnnkls/moira.git"
branch = "main"
root = "rules/fas"

[targets.moira]
path = "rules/fas/moira"
sources.moira = { collapse = false }

[offers.default]
include = ["skills/**", "agents/**", "instructions/**", "rules/fas/**", "henia.toml", "henia.lock", ".henia/harnesses/**", "phora.toml"]

[offers.library]
include = ["skills/**", "henia.toml", "henia.lock", ".henia/harnesses/**"]

[offers.fas]
root = "rules/fas"
