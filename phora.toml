# Canonical artifacts and their dependency layout, offered to consumers.
[sources.moira]
git = "https://github.com/srnnkls/moira.git"
branch = "main"
root = "rules/fas"

[sources.prompting-opus]
url = "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-opus-5-5.md"

[sources.prompting-sonnet]
url = "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/prompting-claude-sonnet-5-5.md"

[sources.prompting-openai]
url = "https://developers.openai.com/api/docs/guides/prompting.md"

[sources.prompting-openai-prompt-engineering]
url = "https://developers.openai.com/api/docs/guides/prompt-engineering.md"

[sources.prompting-openai-latest-model]
url = "https://developers.openai.com/api/docs/guides/latest-model.md"

[targets.moira]
path = "rules/fas/moira"
sources.moira = { collapse = false }

[targets.prompting]
path = "resources/prompting"
sources = ["prompting-opus", "prompting-sonnet", "prompting-openai", "prompting-openai-prompt-engineering", "prompting-openai-latest-model"]

[offers.default]
include = ["skills/**", "agents/**", "instructions/**", "rules/fas/**", "henia.toml", "henia.lock", ".henia/harnesses/**", ".henia/components/**", "phora.toml"]

[offers.library]
include = ["skills/**", "henia.toml", "henia.lock", ".henia/harnesses/**", ".henia/components/**"]

[offers.fas]
root = "rules/fas"
