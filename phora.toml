# Canonical artifacts, their dependency layout, and the harness builds offered to consumers.
[tools."github:srnnkls/henia"]
mise = true

[sources.loqui]
git = "https://github.com/srnnkls/loqui.git"
branch = "main"
include = ["README.md", "languages/**", "resources/**"]

[sources.gestalt]
git = "https://github.com/srnnkls/gestalt.git"
branch = "main"
root = "skills/gestalt"

[sources.limen]
git = "https://github.com/srnnkls/limen.git"
branch = "main"
root = "skills/limen"

[sources.moira]
git = "https://github.com/srnnkls/moira.git"
branch = "main"
root = "rules/fas"

[sources.harnesses]
build = { tool = "github:srnnkls/henia@0.1.0-alpha.6", run = "henia build {input} --output {output}" }

[targets.loqui]
path = "skills/loqui/reference/loqui"
sources.loqui = { collapse = false }

[targets.gestalt]
path = "skills/gestalt"
sources.gestalt = { collapse = false }

[targets.limen]
path = "skills/limen"
sources.limen = { collapse = false }

[targets.moira]
path = "rules/fas/moira"
sources.moira = { collapse = false }

[targets.claude]
path = "dist/claude"
sources.harnesses = { take = [{ "claude/" = "." }], collapse = false }

[targets.codex]
path = "dist/codex"
sources.harnesses = { take = [{ "codex/" = "." }], collapse = false }

[targets.pi]
path = "dist/pi"
sources.harnesses = { take = [{ "pi/" = "." }], collapse = false }

[targets.omp]
path = "dist/omp"
sources.harnesses = { take = [{ "omp/" = "." }], collapse = false }

[offers.default]
include = ["skills/**", "agents/**", "instructions/**", "rules/fas/**", "henia.toml", ".henia/harnesses/**", "phora.toml"]

[offers.fas]
root = "rules/fas"

[offers.claude]
root = "dist/claude"
targets = ["claude"]

[offers.codex]
root = "dist/codex"
targets = ["codex"]

[offers.pi]
root = "dist/pi"
targets = ["pi"]

[offers.omp]
root = "dist/omp"
targets = ["omp"]
