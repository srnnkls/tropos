# Canonical artifacts and the dependency layout advertised to consumers.
[sources.tropos]
path = "."
include = ["skills/**", "agents/**", "instructions/**", "rules/fas/**", "henia.toml", ".henia/harnesses/**", "phora.toml"]
exclude = ["skills/gestalt/", "skills/limen/", "skills/loqui/reference/loqui", "rules/fas/moira/"]

[sources.loqui]
git = "https://github.com/srnnkls/loqui.git"
branch = "main"
include = ["README.md", "languages/**", "resources/**"]

[sources.gestalt]
git = "https://github.com/srnnkls/gestalt.git"
branch = "main"
root = "skills/gestalt"

[sources.limen]
git = "https://github.com/srnnkls/limen.git"
branch = "main"
root = "skills/limen"

[sources.moira]
git = "https://github.com/srnnkls/moira.git"
branch = "main"
root = "rules/fas"

[targets.tropos]
path = "."
sources.tropos = { collapse = false }

[targets.loqui]
path = "skills/loqui/reference/loqui"
sources.loqui = { collapse = false }

[targets.gestalt]
path = "skills/gestalt"
sources.gestalt = { collapse = false }

[targets.limen]
path = "skills/limen"
sources.limen = { collapse = false }

[targets.moira]
path = "rules/fas/moira"
sources.moira = { collapse = false }
