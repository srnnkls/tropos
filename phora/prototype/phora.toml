[paths]
cache = "../../.henia/cache"
state = "../../.henia/source-state"

[hooks]
post_sync = """
henia --config ../../.henia/source/henia.toml build ../../.henia/source --output ../../.henia/build &&
(cd ../deploy && phora sync --prune --fast-forward) &&
scrut test ../../tests/scrut/henia-artifacts.md
"""

[sources.tropos]
path = "../.."
branch = "prototype/henia-phora"
transitive = true

[targets.tropos]
path = "../../.henia/source"
imports = ["tropos"]
