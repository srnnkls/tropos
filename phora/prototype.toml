# Optional repository-local smoke deployment; consumers own their own targets.
[paths]
cache = "cache"
state = "state"

[hooks]
post_sync = "scrut test ../../tests/scrut/henia-artifacts.md"

[sources.tropos]
path = "../packages/tropos"
transitive = true

[targets]
claude = { path = "home/.claude", imports = ["tropos"] }
codex = { path = "home/.codex", imports = [{ source = "tropos", branch = "codex" }] }
pi = { path = "home/.pi", imports = [{ source = "tropos", branch = "pi" }] }
omp = { path = "home/.omp", imports = [{ source = "tropos", branch = "omp" }] }
